<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Reports - Cybersecurity Audit Platform</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar & Topbar Mount Point -->
  <div id="navbar-mount"></div>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    <div class="content-container">
      
      <!-- Page Header -->
      <div class="mb-4">
        <h2 class="fw-bold mb-1 text-dark">Security Audit Reports</h2>
        <p class="text-muted mb-0">Access and download generated PDF reports for completed audit runs.</p>
      </div>

      <!-- Reports List Card -->
      <div class="cyber-card p-0">
        <div class="table-responsive">
          <table class="table table-cyber align-middle mb-0">
            <thead>
              <tr>
                <th>Audit ID</th>
                <th>Target Network / IP</th>
                <th>Scan Completion Date</th>
                <th>Security Score</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="reports-tbody">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading completed reports...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Page Scripts -->
  <script type="module" src="js/reports.js?v=1.0.3"></script>
</body>
</html>
