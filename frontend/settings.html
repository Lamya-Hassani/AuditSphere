<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - AuditSphere</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar & Topbar Mount Point -->
  <div id="navbar-mount"></div>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    <div class="content-container">
      
      <!-- Page Header -->
      <div class="mb-4">
        <h2 class="fw-bold mb-1 text-dark">User Management</h2>
        <p class="text-muted mb-0">Manage platform users, roles, and access control permissions.</p>
      </div>

      <!-- User Management Card -->
      <div class="cyber-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0 text-dark">Platform Users & Operators</h5>
          <button class="btn btn-cyber-primary btn-sm" id="add-user-btn">
            <i class="bi bi-plus-lg me-1"></i>Create New Account
          </button>
        </div>
        
        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Super Administrator</th>
                <th>Date Joined</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading user registry...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- User Create / Edit Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header border-bottom bg-light">
          <h5 class="modal-title fw-bold text-dark" id="userModalTitle">Create User Account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="user-form">
          <div class="modal-body">
            <input type="hidden" id="user-id">
            
            <div class="row g-3">
              <div class="col-md-6">
                <label for="usr-username" class="form-label small fw-bold text-muted">USERNAME</label>
                <input type="text" id="usr-username" class="form-control form-control-sm" required>
              </div>
              <div class="col-md-6">
                <label for="usr-password" class="form-label small fw-bold text-muted" id="password-label">PASSWORD</label>
                <input type="password" id="usr-password" class="form-control form-control-sm" required minlength="6">
              </div>
              <div class="col-12">
                <label for="usr-email" class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
                <input type="email" id="usr-email" class="form-control form-control-sm" required>
              </div>
              <div class="col-md-6">
                <label for="usr-first-name" class="form-label small fw-bold text-muted">FIRST NAME</label>
                <input type="text" id="usr-first-name" class="form-control form-control-sm">
              </div>
              <div class="col-md-6">
                <label for="usr-last-name" class="form-label small fw-bold text-muted">LAST NAME</label>
                <input type="text" id="usr-last-name" class="form-control form-control-sm">
              </div>
              
              <div class="col-md-6">
                <label for="usr-role" class="form-label small fw-bold text-muted">PLATFORM ROLE</label>
                <select id="usr-role" class="form-select form-select-sm" required>
                  <option value="auditor">Auditor (Read-Only Scan Run)</option>
                  <option value="admin" id="role-admin-option">Administrator</option>
                </select>
              </div>
              <div class="col-md-6 d-flex align-items-end pb-1">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="usr-superuser">
                  <label class="form-check-label small fw-semibold text-dark" for="usr-superuser" id="superuser-label">
                    Superuser Privilege
                  </label>
                </div>
              </div>
            </div>

          </div>
          <div class="modal-footer border-top bg-light">
            <button type="button" class="btn btn-cyber-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-cyber-primary btn-sm" id="user-save-btn">Save Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Page Scripts -->
  <script type="module" src="js/settings.js?v=1.0.3"></script>
</body>
</html>
