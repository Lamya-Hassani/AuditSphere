<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit History - Cybersecurity Audit Platform</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom Cyber Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mount Point for Top Navigation -->
  <div id="navbar-mount"></div>

  <!-- Main Container -->
  <main class="container-fluid px-lg-4 py-4">

    <!-- Header Title & Action -->
    <div class="row align-items-center mb-4">
      <div class="col-md-7">
        <h3 class="fw-bold mb-1 d-flex align-items-center gap-2">
          <i class="bi bi-shield-check text-info"></i>
          <span>Security Audit History</span>
        </h3>
        <p class="text-muted small mb-0">Chronological repository of all network vulnerability audits and execution logs</p>
      </div>

      <div class="col-md-5 mt-3 mt-md-0 text-md-end">
        <a href="scan.html" class="btn btn-cyber-primary d-inline-flex align-items-center gap-2">
          <i class="bi bi-plus-circle"></i> Launch New Scan
        </a>
      </div>
    </div>

    <!-- Audits Table Card -->
    <div class="cyber-card p-4">
      <div class="table-responsive">
        <table class="table table-cyber align-middle mb-0">
          <thead>
            <tr>
              <th>Audit ID</th>
              <th>Target Subnet / IP</th>
              <th>Scan Date</th>
              <th>Scan Type</th>
              <th>Security Score</th>
              <th>Executed By</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="audits-tbody">
            <tr>
              <td colspan="8" class="text-center text-muted py-4">Loading audit logs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Page Scripts -->
  <script type="module" src="js/audits.js"></script>
</body>
</html>
